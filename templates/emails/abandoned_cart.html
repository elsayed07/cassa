<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>You left something behind</title></head>
<body style="font-family: sans-serif; color: #111; padding: 24px;">
  <h1>You left something in your cart</h1>
  <p>Hi {{ cart.user.first_name|default:"there" }}, you have {{ cart.item_count }} item{{ cart.item_count|pluralize }} waiting.</p>
  <a href="{{ STORE_URL }}{% url 'carts:detail' %}" style="background:#7c3aed;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:16px;">Complete Your Purchase</a>
</body>
</html>
