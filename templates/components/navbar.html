{% load i18n %}
<nav class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="/" class="text-xl font-bold tracking-tight">Cassa</a>
    <div class="flex items-center gap-4">
      <a href="{% url 'carts:detail' %}" class="relative">
        Cart
        {% if cart_item_count %}
          <span class="ml-1 text-xs bg-violet-600 text-white rounded-full px-1.5">{{ cart_item_count }}</span>
        {% endif %}
      </a>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:dashboard' %}">Account</a>
      {% else %}
        <a href="{% url 'account_login' %}">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
