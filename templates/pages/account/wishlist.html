{% extends "base.html" %}
{% block title %}Wishlist — Cassa{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
  <h1 class="text-2xl font-bold mb-6">Wishlist</h1>
  {% for item in items %}
    <div class="flex gap-4 py-3 border-b border-zinc-100">
      <a href="{% url 'catalog:product' item.product.slug %}" class="flex-1 hover:underline">{{ item.product }}</a>
    </div>
  {% empty %}
    <p class="text-zinc-500">Your wishlist is empty.</p>
  {% endfor %}
</div>
{% endblock %}
