[project]
name = "cassa"
version = "0.1.0"
description = "Production-grade ecommerce platform"
requires-python = ">=3.13"
dependencies = [
    # Django core
    "django>=5.2,<6",
    "psycopg[binary]>=3.2",
    "django-redis>=5.4",
    # Configuration
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    # Auth
    "django-allauth[socialaccount]>=65.0",
    # API
    "django-ninja>=1.3",
    "django-ninja-jwt>=5.3",
    # Async
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "django-celery-results>=2.5",
    # Payments
    "stripe>=11.0",
    # Storage & media
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "pillow>=11.0",
    # Templates & frontend
    "django-tailwind>=3.8",
    "django-htmx>=1.21",
    "whitenoise[brotli]>=6.8",
    # PDF generation
    "weasyprint>=62.0",
    # i18n content
    "django-parler>=2.3",
    # Category trees
    "django-treebeard>=4.7",
    # Email
    "django-anymail>=12.0",
    # Admin
    "django-unfold>=0.42",
    # Rate limiting
    "django-ratelimit>=4.1",
    # Observability
    "structlog>=24.4",
    "sentry-sdk[django]>=2.14",
    "django-prometheus>=2.3",
]

[dependency-groups]
dev = [
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "faker>=30.0",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "django-debug-toolbar>=4.4",
    "ipython>=8.0",
    "django-migration-linter>=5.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "S", "A"]
ignore = [
    "ANN101", "ANN102", "ANN401",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"**/migrations/**" = ["ANN", "N", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
exclude = ["**/migrations/**", ".venv/**"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=apps --cov=shared --cov-report=term-missing -q"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
